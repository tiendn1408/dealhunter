name: dealhunter-prod

services:
  postgres:
    container_name: dealhunter-prod-postgres
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dealuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealpass}
      POSTGRES_DB: ${POSTGRES_DB:-dealdb}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dealuser} -d ${POSTGRES_DB:-dealdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dealhunter-prod-network

  redis:
    container_name: dealhunter-prod-redis
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dealhunter-prod-network

  migration:
    container_name: dealhunter-prod-migration
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/bin/migrate", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dealuser}:${POSTGRES_PASSWORD:-dealpass}@postgres:5432/${POSTGRES_DB:-dealdb}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dealhunter-prod-network

  api:
    container_name: dealhunter-prod-api
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/bin/api"]
    restart: always
    ports:
      # Only the host's nginx reaches the API (OPS-03): a public port would let clients bypass the proxy
      # and, through Docker's userland proxy, look like a trusted proxy address
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    environment:
      APP_ENV: production
      # Reverse proxy whose X-Forwarded-For is believed: the host's nginx reaches the container from the
      # network gateway. Never the whole Docker range: another container could then fake client IPs.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32,::1/128,${DEALHUNTER_GATEWAY:-172.30.240.1}/32}
      HTTP_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-dealuser}:${POSTGRES_PASSWORD:-dealpass}@postgres:5432/${POSTGRES_DB:-dealdb}?sslmode=disable
      REDIS_URL: redis://redis:6379
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required (e.g. https://dealhunter.vn)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      AUTH_COOKIE_SECURE: "true"
      AFFILIATE_ENABLED: ${AFFILIATE_ENABLED:-false}
      SHOPEE_AFFILIATE_ID: ${SHOPEE_AFFILIATE_ID}
      SHOPEE_AFFILIATE_URL_TEMPLATE: ${SHOPEE_AFFILIATE_URL_TEMPLATE}
      LAZADA_AFFILIATE_ID: ${LAZADA_AFFILIATE_ID}
      LAZADA_AFFILIATE_URL_TEMPLATE: ${LAZADA_AFFILIATE_URL_TEMPLATE}
      TIKTOK_AFFILIATE_ID: ${TIKTOK_AFFILIATE_ID}
      TIKTOK_AFFILIATE_URL_TEMPLATE: ${TIKTOK_AFFILIATE_URL_TEMPLATE}
      ACCESSTRADE_DEEPLINK_URL: ${ACCESSTRADE_DEEPLINK_URL}
      ZALO_ENABLED: ${ZALO_ENABLED:-false}
      ZALO_APP_ID: ${ZALO_APP_ID}
      ZALO_OA_SECRET_KEY: ${ZALO_OA_SECRET_KEY}
      ZALO_REFRESH_TOKEN: ${ZALO_REFRESH_TOKEN}
      ZALO_OA_ACCESS_TOKEN: ${ZALO_OA_ACCESS_TOKEN}
      ZALO_TEMPLATE_ID: ${ZALO_TEMPLATE_ID}
      ZALO_OTP_TEMPLATE_ID: ${ZALO_OTP_TEMPLATE_ID:-}
      ZALO_WEBHOOK_SECRET: ${ZALO_WEBHOOK_SECRET}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - dealhunter-prod-network

  worker:
    container_name: dealhunter-prod-worker
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/bin/worker"]
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-dealuser}:${POSTGRES_PASSWORD:-dealpass}@postgres:5432/${POSTGRES_DB:-dealdb}?sslmode=disable
      REDIS_URL: redis://redis:6379
      REDIS_PORT: 6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      FETCH_TIMEOUT: ${FETCH_TIMEOUT:-10s}
      MAX_RETRY: ${MAX_RETRY:-5}
      ZALO_ENABLED: ${ZALO_ENABLED:-false}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - dealhunter-prod-network

  scheduler:
    container_name: dealhunter-prod-scheduler
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/bin/scheduler"]
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-dealuser}:${POSTGRES_PASSWORD:-dealpass}@postgres:5432/${POSTGRES_DB:-dealdb}?sslmode=disable
      REDIS_URL: redis://redis:6379
      REDIS_PORT: 6379
      DEFAULT_POLL_INTERVAL: ${DEFAULT_POLL_INTERVAL:-1800}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - dealhunter-prod-network

  notifier:
    container_name: dealhunter-prod-notifier
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/bin/notifier"]
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-dealuser}:${POSTGRES_PASSWORD:-dealpass}@postgres:5432/${POSTGRES_DB:-dealdb}?sslmode=disable
      REDIS_URL: redis://redis:6379
      REDIS_PORT: 6379
      ZALO_ENABLED: ${ZALO_ENABLED:-false}
      ZALO_APP_ID: ${ZALO_APP_ID}
      ZALO_OA_SECRET_KEY: ${ZALO_OA_SECRET_KEY}
      ZALO_REFRESH_TOKEN: ${ZALO_REFRESH_TOKEN}
      ZALO_OA_ACCESS_TOKEN: ${ZALO_OA_ACCESS_TOKEN}
      ZALO_TEMPLATE_ID: ${ZALO_TEMPLATE_ID}
      AFFILIATE_ENABLED: ${AFFILIATE_ENABLED:-false}
      SHOPEE_AFFILIATE_ID: ${SHOPEE_AFFILIATE_ID}
      SHOPEE_AFFILIATE_URL_TEMPLATE: ${SHOPEE_AFFILIATE_URL_TEMPLATE}
      LAZADA_AFFILIATE_ID: ${LAZADA_AFFILIATE_ID}
      LAZADA_AFFILIATE_URL_TEMPLATE: ${LAZADA_AFFILIATE_URL_TEMPLATE}
      TIKTOK_AFFILIATE_ID: ${TIKTOK_AFFILIATE_ID}
      TIKTOK_AFFILIATE_URL_TEMPLATE: ${TIKTOK_AFFILIATE_URL_TEMPLATE}
      ACCESSTRADE_DEEPLINK_URL: ${ACCESSTRADE_DEEPLINK_URL}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - dealhunter-prod-network

  web:
    container_name: dealhunter-prod-web
    build:
      context: ../dealhunter-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required (e.g. https://dealhunter.vn/api/v1)}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
        NEXT_PUBLIC_EXTENSION_ID: ${EXTENSION_ID:-}
    restart: always
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - api
    networks:
      - dealhunter-prod-network

volumes:
  pgdata_prod:
    name: dealhunter-pgdata-prod
  redisdata_prod:
    name: dealhunter-redisdata-prod

networks:
  dealhunter-prod-network:
    name: dealhunter-prod-network
    # A fixed subnet makes the gateway address known: only the gateway (the host's nginx reaching the
    # 127.0.0.1-bound API) is a trusted proxy, not every container on the network
    ipam:
      config:
        - subnet: ${DEALHUNTER_SUBNET:-172.30.240.0/24}
          gateway: ${DEALHUNTER_GATEWAY:-172.30.240.1}
